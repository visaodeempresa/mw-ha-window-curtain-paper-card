<style>
  body{margin:0;padding:22px;background:#20242b;font:13px/1.4 -apple-system,system-ui,sans-serif;}
  .row{display:grid;grid-template-columns:repeat(3,360px);gap:20px;margin-bottom:20px;}
  .row.claro{background:#eef0f3;padding:16px;border-radius:14px;}
  .cap{font-size:11px;letter-spacing:.4px;opacity:.62;margin:0 0 6px 2px;color:#dfe3e8;}
  .row.claro .cap{color:#22262c;}
</style>
<div class="row" id="a"></div>
<div class="row claro" id="b"></div>
<script src="../dist/mw-window-curtain-paper-card.js"></script>
<script src="stubs.js"></script>
<script>
const put = (sel, list) => list.forEach(([cap, over]) => {
  const cell = document.createElement("div");
  cell.innerHTML = '<div class="cap">' + cap + "</div>";
  const card = document.createElement("mw-window-curtain-paper-card");
  card.setConfig(Object.assign({}, BASE, over));
  card.hass = HASS;
  cell.appendChild(card);
  document.querySelector(sel).appendChild(cell);
});
put("#a", [
  ["pictograma · o padrão", { name: "JANELA DA SUÍTE" }],
  ["modo ambiente · tudo de uma vez", { room_mode: true, exhaust: "fan.exaustor", name: "SUÍTE" }],
  ["papel escuro · anil", { paper_dark: true, paper: "indigo-5", name: "JANELA DE NOITE" }],
]);
put("#b", [
  ["paisagem · a cena inteira", { scene_mode: "paisagem", name: "JANELA DA SALA", opener: "cover.op_l", opener_right: "cover.op_r", panes: "4", paper: "orange-2" }],
  ["sem desenho · só os comandos", { scene_mode: "none", name: "SUÍTE — SÓ COMANDOS", exhaust: "fan.exaustor" }],
  ["peça de 76 px · papel verde", { control_size: 76, paper: "green-2", name: "ALVO GRANDE" }],
]);
</script>
